<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10221c" />
    <title>라이브 방 보기 · 포커스라이브</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/live-watch.js" defer></script>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="포커스라이브 첫 화면"><span class="brand-mark" aria-hidden="true"><span></span></span><span>포커스라이브</span></a>
        <span class="topbar-note">경기 라이브</span>
      </header>
      <main>
        <section class="panel" aria-labelledby="live-title">
          <div class="section-heading"><span class="section-number">LIVE</span><div><p class="section-kicker">실시간 시청</p><h1 id="live-title">라이브 방 보기</h1></div></div>
          <p class="section-description">현재 방송 중인 촬영방을 골라 경기를 시청하세요. 같은 와이파이에서 이용할 수 있습니다.</p>
          <div id="live-room-list" class="live-room-list" aria-live="polite">라이브 방을 확인하고 있습니다.</div>
          <div id="live-player-panel" class="live-player-panel" hidden>
            <h2 id="live-player-title">경기 라이브</h2>
            <video id="live-player" autoplay playsinline controls></video>
            <p id="live-watch-status" role="status">연결 중…</p>
            <button class="button button-secondary" id="resume-live" type="button" hidden>재생하기</button>
            <button class="button button-secondary" id="leave-live" type="button">시청 종료</button>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
